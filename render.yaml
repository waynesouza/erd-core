# Render Blueprint (infrastructure as code) for the backend.
#
# The frontend has its own Blueprint in the erd-client repository. A resource must not belong
# to two Blueprints, and keeping them apart also keeps each repository's deploy records on its
# own GitHub Deployments tab.
#
# The service runs on the free instance type, so it sleeps after 15 minutes without traffic and
# shares the 750 free instance hours per month with the frontend. The browser only ever talks to
# erd-client, which proxies /api and /ws here: that keeps everything on a single origin
# (onrender.com is on the Public Suffix List, so sibling subdomains are cross-site and would drop
# the JWT cookie), and free services cannot use the private network.
#
# Values marked `sync: false` are filled in the Render dashboard and never stored in git.
services:
  - type: web
    name: erd-core
    runtime: docker
    plan: free
    region: virginia
    branch: main
    # Waits for the commit's CI checks instead of deploying on push. Render skips the deploy
    # when a commit has zero checks, which is why tests.yml also runs on push to main.
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      # 512 MB / 0.1 CPU: cap the heap and keep JIT cheap so startup fits the instance.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
      # Neon: use the direct (non -pooler) host, since Hibernate runs DDL on startup.
      # jdbc:postgresql://<neon-host>/diagram?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      # Atlas: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/erd?retryWrites=true&w=majority&authSource=admin
      # The database must NOT be named `local`, which Atlas reserves for its own use, and
      # authSource=admin is required: naming a database in the path makes the driver
      # authenticate against it, while Atlas keeps its users in `admin`.
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      # Random 256-bit base64 value, which is what JwtService#getKey expects.
      - key: ERD_APP_JWT_SECRET
        generateValue: true
      - key: ERD_APP_JWT_COOKIE_SECURE
        value: "true"
      # Origin the STOMP handshake arrives with. Update it if Render suffixes the frontend name.
      - key: ERD_APP_WEBSOCKET_ALLOWED_ORIGINS
        value: "https://erd-client.onrender.com"
