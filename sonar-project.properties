sonar.projectKey=erd-core
sonar.projectName=ERD Core
sonar.projectVersion=0.0.1-SNAPSHOT

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Coverage is produced by the jacoco-maven-plugin during `mvn verify`.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# NOTE: sonar.coverage.exclusions is deliberately absent. Every production class under
# src/main/java is measured, including DTOs and JPA entities, so the reported coverage
# figure refers to the whole codebase and not to a filtered subset of it.
